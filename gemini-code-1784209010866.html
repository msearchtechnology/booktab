<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenCLOCK</title>
    <style>
        /* --- EASY COLOR CONFIGURATION --- */
        :root {
            --logo-circle-bg: #000000;
            --sq-12-oclock: #ff3b30;   
            --sq-1-30-oclock: #ff2d55; 
            --sq-3-oclock: #af52de;    
            --sq-4-30-oclock: #5856d6; 
            --sq-6-oclock: #007aff;    
            --sq-7-30-oclock: #34c759; 
            --sq-9-oclock: #ffcc00;    
            --sq-10-30-oclock: #ff9500; 
        }

        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
        }
        
        /* --- Premium Splash Screen --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.6s ease;
        }
        .splash-content { display: flex; align-items: center; justify-content: center; gap: 0; }
        .splash-circle { width: 60px; height: 60px; transform-origin: center; animation: spinCircle 1.3s ease forwards; }
        .splash-text { font-size: 2.2rem; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; opacity: 0; max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width 0.8s ease, opacity 0.6s ease; }
        .reveal-active .splash-text { opacity: 1; max-width: 300px; margin-left: 15px; }
        @keyframes spinCircle { 0% { transform: scale(0.2) rotate(0deg); opacity: 0; } 60% { transform: scale(1.1) rotate(240deg); opacity: 1; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }

        /* --- Header --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 10; border-bottom: 1px solid #111; }
        .menu-icon, .search-icon { width: 24px; height: 24px; stroke: #fff; cursor: pointer; fill: none; }
        header h3 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }

        .install-banner {
            display: none; position: fixed; top: 15px; left: 5%; right: 5%; background-color: #1e1f22; border: 1px solid #3c4043; padding: 12px 18px; border-radius: 16px; z-index: 1000; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .install-text { font-size: 0.95rem; font-weight: 500; }
        .install-btn { background-color: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }

        /* --- STRICT NO-ANIMATION RULES FOR IMAGES --- */
        img, .user-msg img, .ai-msg img, .wiki-cover-img, .card-thumb, .preview-container img {
            animation: none !important;
            transition: none !important;
            transform: none !important;
        }

        /* --- Chat Main Area --- */
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 120px; scroll-behavior: smooth; }
        
        .user-msg { background-color: #2f3032; color: white; padding: 12px 24px; border-radius: 25px; align-self: flex-end; max-width: 75%; word-wrap: break-word; font-size: 1.05rem; border: 1px solid #444; }
        .user-msg img { max-width: 180px; border-radius: 12px; display: block; margin-top: 5px; }

        .ai-msg { color: #fff; padding: 5px 10px; align-self: flex-start; max-width: 90%; font-size: 1.1rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; display: flex; flex-direction: column; }
        .ai-msg img { max-width: 100%; max-height: 280px; border-radius: 16px; display: block; margin-bottom: 12px; }

        /* --- Chat Inputs --- */
        .input-wrapper { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 20px 25px 20px; background: linear-gradient(transparent, rgba(0,0,0,0.95) 25%, #000 100%); z-index: 5; }
        .input-container { background-color: #000; border-radius: 35px; display: flex; align-items: center; padding: 6px 10px; border: 1.5px solid #fff; max-width: 650px; margin: 0 auto; }
        input[type="text"] { background: transparent; border: none; color: white; flex-grow: 1; padding: 12px 15px; outline: none; font-size: 1.1rem; min-width: 0; }
        .icon-btn { background: none; border: none; color: #80868b; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        #sendBtn { color: #fff; background: rgba(255,255,255,0.1); }

        /* --- LEGACY CHAT MODALS (RESTORED FOR QUICK EDIT) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #202124; padding: 25px; border-radius: 15px; width: 85%; max-width: 400px; border: 1px solid #444; }
        .modal-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #555; color: #fff; box-sizing: border-box; border-radius: 8px; font-size: 1rem; outline: none; }
        .modal-input:focus { border-color: #888; }
        textarea.modal-input { font-family: inherit; resize: none; }
        .preview-container { text-align: center; margin-bottom: 15px; }
        .preview-container img { max-height: 120px; border-radius: 8px; border: 1px solid #555; }

        /* --- 🔍 FULLSCREEN SEARCH PAD OVERLAY --- */
        #search-device-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 500; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .search-pad-header { display: flex; align-items: center; gap: 12px; max-width: 650px; width: 100%; margin: 10px auto 15px auto; }
        .search-pad-container { flex-grow: 1; background-color: #000; border-radius: 35px; display: flex; align-items: center; padding: 6px 15px; border: 1.5px solid #fff; }
        .search-pad-container input { background: transparent; border: none; color: #fff; padding: 10px 5px; font-size: 1.1rem; outline: none; width: 100%; }
        
        #edit-mode-status { display: none; text-align: center; color: #ff3b30; font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; border: 1px dashed #ff3b30; padding: 5px; border-radius: 10px; max-width: 650px; margin: 0 auto 15px auto; }
        #create-new-btn { display: none; background: #fff; color: #000; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; margin: 0 auto 15px auto; width: max-content; font-size: 1rem; }

        /* Suggestion Feed CSS */
        #search-results-feed { max-width: 650px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .clean-data-card { background: #121315; border: 1px solid #232528; border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
        .card-main-info { display: flex; align-items: center; gap: 16px; }
        .card-thumb { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; background: #202124; flex-shrink: 0; border: 1px solid #333; }
        .card-details { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1; }
        .card-title { font-weight: 700; font-size: 1.15rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 0.95rem; color: #9aa0a6; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- WIKIPEDIA KNOWLEDGE PANEL (FIXED FOR SCROLLING) --- */
#wiki-detail-view { 
    display: none; 
    background: #1c1c1e; 
    border-radius: 20px; 
    /* overflow: hidden;  <-- Isse remove kar dein */
    
    /* SCROLLING ENABLE KARNE KE LIYE YEH PROPERTIES DAALEIN: */
    overflow-y: auto;          
    max-height: 85vh;          /* Card ki height screen ki 85% tak limited rahegi */
    -webkit-overflow-scrolling: touch; /* Mobile par smooth scroll ke liye */
    
    max-width: 650px; 
    width: 90%; 
    margin: 20px auto 20px auto; 
    flex-direction: column; 
    position: relative; 
    border: 1px solid #2c2c2e; 
}
        /* --- ADVANCED DATA CREATION & EDITING FORM --- */
        #advanced-form-card { display: none; background: #161719; border: 1px solid #2c2d30; border-radius: 16px; padding: 20px; max-width: 650px; width: 100%; margin: 0 auto 20px auto; box-sizing: border-box; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-circle" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="var(--logo-circle-bg)" />
                <g transform="translate(50,50)">
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-12-oclock)" transform="rotate(0)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-1-30-oclock)" transform="rotate(45)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-3-oclock)" transform="rotate(90)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-4-30-oclock)" transform="rotate(135)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-6-oclock)" transform="rotate(180)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-7-30-oclock)" transform="rotate(225)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-9-oclock)" transform="rotate(270)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-10-30-oclock)" transform="rotate(315)" rx="1"/>
                </g>
            </svg>
            <span class="splash-text">OpenCLOCK</span>
        </div>
    </div>

    <div id="installBanner" class="install-banner">
        <span class="install-text">⚡ Install OpenCLOCK App?</span>
        <button class="install-btn" onclick="triggerPWAInstall()">Install</button>
    </div>

    <header>
        <svg class="menu-icon" onclick="clearLocalDatabase()"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2.5"/></svg>
        <h3>OpenCLOCK</h3>
        <svg class="search-icon" onclick="launchSearchPad()"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2.5"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2.5"/></svg>
    </header>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <div class="input-container">
            <input type="file" id="imageLoader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="icon-btn" onclick="document.getElementById('imageLoader').click()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>
            
            <input type="text" id="searchBox" placeholder="Ask OpenCLOCK" onkeypress="handleEnter(event)" oninput="checkAutoEdit(event)">
            
            <button id="sendBtn" onclick="handleSendClick()" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" /><path d="M8 16l8-8M11 8h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
        </div>
    </div>

    <div id="textModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Add Quick Text Data</h3>
            <input type="text" id="editKey" class="modal-input" placeholder="Keyword (e.g., Google)">
            <textarea id="editValue" class="modal-input" rows="4" placeholder="About..."></textarea>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button onclick="closeModal('textModal')" style="flex: 1; background: #444; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancel</button>
                <button onclick="saveTextData()" style="flex: 1; background: #fff; color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Save</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 10px;">Save Image Data</h3>
            <div class="preview-container"><img id="modalImgPreview" src="" alt="Selected Image"></div>
            <input type="text" id="imageKey" class="modal-input" placeholder="Image Name (e.g., Apple)">
            <textarea id="imageAbout" class="modal-input" rows="3" placeholder="About this image..."></textarea>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button onclick="closeModal('imageModal')" style="flex: 1; background: #444; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancel</button>
                <button onclick="saveImageData()" style="flex: 1; background: #fff; color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Save</button>
            </div>
        </div>
    </div>

    <div id="search-device-overlay">
        <div class="search-pad-header">
            <button class="icon-btn" onclick="exitSearchPad()" style="color: #fff;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
            <div class="search-pad-container">
                <input type="text" id="padSearchInput" placeholder="Search saved database..." oninput="performPadSearch(event)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: #80868b; margin-right: 5px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
        </div>
        
        <div id="edit-mode-status">🛠️ EDIT MODE IS ACTIVE</div>

        <button id="create-new-btn" onclick="showAdvancedForm()">Create New Data</button>

        <div id="wiki-detail-view"></div>

        <div id="advanced-form-card">
            <h3 id="form-heading" style="margin: 0; font-size: 1.3rem; color: #fff;">Add Data to System</h3>
            <input type="hidden" id="form-edit-id" value="">
            
            <div style="display: flex; flex-direction: column; gap: 6px;"><label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">Title (Keyword/Heading)</label><input type="text" id="form-title" style="background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none;" placeholder="e.g., Google"></div>
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top:10px;"><label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">Short Description</label><input type="text" id="form-short-desc" style="background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none;" placeholder="e.g., Search Engine"></div>
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top:10px;">
                <label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">Upload Banner Image</label>
                <input type="file" id="form-image" accept="image/*" onchange="handleFormImage(event)" style="background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 10px; font-size: 0.95rem; outline: none;">
                <div id="form-image-preview-container" style="margin-top: 10px; display: none;">
                    <img id="form-image-preview" src="" style="max-height: 100px; border-radius: 8px; border: 1px solid #444;">
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top:10px;">
                <label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">Add Questions (Keywords Mapping)</label>
                <div id="questions-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button type="button" style="background: #222; color: #fff; border: 1px dashed #555; padding: 8px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem;" onclick="addQuestionBox()">+ Add Question</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top:10px;">
                <label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">Info Rows (Key | Value Box)</label>
                <div id="rows-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button type="button" style="background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem;" onclick="addRowBox()">+ Add Row</button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 6px; margin-top:10px;"><label style="font-size: 0.9rem; color: #aaa; font-weight: 600;">About (Complete Description Text)</label><textarea id="form-about" style="background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; font-size: 0.95rem; outline: none; font-family: inherit; resize: none;" rows="4" placeholder="Write detailed info here..."></textarea></div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button style="background: #222; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 10px; flex: 1; font-weight: bold; cursor: pointer;" onclick="hideAdvancedForm()">Cancel</button>
                <button style="background: #fff; color: #000; border: none; padding: 12px; border-radius: 10px; flex: 1; font-weight: bold; cursor: pointer;" onclick="saveAdvancedData()">Save & Publish</button>
            </div>
        </div>

        <div id="search-results-feed"></div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const searchBox = document.getElementById('searchBox');
        
        let db = {};
        let tempImageBase64 = ""; 
        let tempFormImageBase64 = "";
        let editModeActive = false; 

        // Chat flow variables
        let lastImageForEdit = null; 
        let lastQuery = ""; 

        let animationTimeout = null;
        let isAnimating = false;
        let currentTypingText = "";
        let currentTypingIndex = 0;
        let currentTypingElement = null;

        /* --- INDEXEDDB SYSTEM --- */
        let dbInstance = null;
        const dbName = "OpenClockDB";
        const storeName = "dataStore";

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function(e) {
            if (!e.target.result.objectStoreNames.contains(storeName)) {
                e.target.result.createObjectStore(storeName);
            }
        };
        request.onsuccess = function(e) {
            dbInstance = e.target.result;
            loadAllDataFromDB(); 
        };

        function loadAllDataFromDB() {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction([storeName], "readonly");
            const cursorReq = transaction.objectStore(storeName).openCursor();
            db = {}; 
            cursorReq.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    db[cursor.key] = cursor.value;
                    cursor.continue();
                }
            };
        }

        function persistData(key, value) {
            if (dbInstance) dbInstance.transaction([storeName], "readwrite").objectStore(storeName).put(value, key);
        }

        function clearLocalDatabase() {
            if (confirm("🚨 Clear complete local app database store?")) {
                dbInstance.transaction([storeName], "readwrite").objectStore(storeName).clear().onsuccess = function() {
                    db = {}; chatContainer.innerHTML = ""; alert("🗑️ All data wiped out safely.");
                };
            }
        }

        /* --- SPLASH SCREEN --- */
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.querySelector('.splash-content').classList.add('reveal-active'); }, 1200);
            setTimeout(() => { document.getElementById('splash-screen').style.opacity = '0'; setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 600); }, 2800);
        });

        /* --- PWA SYSTEM --- */
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });
        function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('installBanner').style.display = 'none'; });
            }
        }

        /* --- QUICK CHAT EDIT TRIGGER --- */
        function checkAutoEdit(e) {
            const val = e.target.value.trim().toLowerCase();
            if (val === 'edit') {
                e.target.value = ''; 
                if (lastImageForEdit) {
                    document.getElementById('modalImgPreview').src = lastImageForEdit;
                    document.getElementById('imageKey').value = '';
                    document.getElementById('imageAbout').value = '';
                    document.getElementById('imageModal').style.display = 'flex';
                } else {
                    document.getElementById('editKey').value = lastQuery ? lastQuery : '';
                    document.getElementById('editValue').value = '';
                    document.getElementById('textModal').style.display = 'flex';
                }
            }
        }

        /* --- SMALL MODAL SAVE FUNCTIONS --- */
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function saveTextData() {
            const key = document.getElementById('editKey').value.trim().toLowerCase();
            const value = document.getElementById('editValue').value.trim();
            if (!key || !value) { alert("Please fill both boxes!"); return; }

            const entry = { type: 'text', text: value, about: value };
            db[key] = entry;
            persistData(key, entry); 
            closeModal('textModal');
            setTimeout(() => { triggerChatResponse(key); }, 300);
        }

        function saveImageData() {
            const titleInput = document.getElementById('imageKey').value.trim();
            const titleKey = titleInput.toLowerCase();
            const aboutInput = document.getElementById('imageAbout').value.trim();
            if (!titleInput || !aboutInput || !lastImageForEdit) { alert("Please complete details!"); return; }

            const dataAll = { 
                type: 'image_and_text', 
                src: lastImageForEdit, 
                text: aboutInput,
                name: titleInput,
                about: aboutInput
            };

            db[titleKey] = dataAll;
            persistData(titleKey, dataAll);
            closeModal('imageModal');
            setTimeout(() => { triggerChatResponse(titleKey); }, 300);
        }

        /* --- 🔍 SEARCH PAD LOGIC --- */
        function launchSearchPad() {
            document.getElementById('search-device-overlay').style.display = 'flex';
            document.getElementById('padSearchInput').focus();
            document.getElementById('padSearchInput').value = "";
            performPadSearch({ target: document.getElementById('padSearchInput') });
        }

        function exitSearchPad() {
            document.getElementById('search-device-overlay').style.display = 'none';
            document.getElementById('padSearchInput').value = "";
            document.getElementById('search-results-feed').innerHTML = "";
            document.getElementById('wiki-detail-view').style.display = 'none';
            hideAdvancedForm();
        }

        function toggleEditMode() {
            editModeActive = !editModeActive;
            const statusDiv = document.getElementById('edit-mode-status');
            const createBtn = document.getElementById('create-new-btn');
            if (editModeActive) {
                statusDiv.style.display = 'block';
                createBtn.style.display = 'block';
            } else {
                statusDiv.style.display = 'none';
                createBtn.style.display = 'none';
                hideAdvancedForm();
            }
            performPadSearch({ target: document.getElementById('padSearchInput') });
        }

        function performPadSearch(e) {
            const rawQuery = e.target.value.trim();
            const queryVal = rawQuery.toLowerCase();
            const feedContainer = document.getElementById('search-results-feed');
            const wikiView = document.getElementById('wiki-detail-view');
            
            feedContainer.innerHTML = "";
            wikiView.style.display = 'none';

            // Hidden trigger command to turn on/off edit mode
            if (queryVal === 'edit') {
                e.target.value = '';
                toggleEditMode();
                return;
            }

            if (!queryVal && !editModeActive) return;

            for (let key in db) {
                const item = db[key];
                if (!item) continue;

                let itemTitle = key;
                let displayDesc = "";
                let itemQuestions = "";
                
                if (typeof item === 'object') {
                    itemTitle = item.title || item.name || key;
                    displayDesc = item.shortDesc || item.about || item.text || "";
                    if (item.questions) itemQuestions = item.questions.join(" ");
                } else {
                    displayDesc = item;
                }

                const searchStr = itemTitle.toLowerCase() + " " + displayDesc.toLowerCase() + " " + itemQuestions.toLowerCase();
                
                if (!queryVal || searchStr.includes(queryVal)) {
                    const card = document.createElement('div');
                    card.className = 'clean-data-card';
                    
                    card.onclick = () => { showSearchWikiCard(key, item); };

                    let thumbHtml = "";
                    if (item && typeof item === 'object' && item.src) {
                        thumbHtml = `<img class="card-thumb" src="${item.src}" alt="">`;
                    }

                    let actionControls = "";
                    if (editModeActive) {
                        actionControls = `
                            <div style="display: flex; gap: 10px; margin-top: 5px;">
                                <button style="background: #007aff; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="event.stopPropagation(); editCard('${key}')">Edit</button>
                                <button style="background: #ff3b30; color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="event.stopPropagation(); deleteCard('${key}')">Delete</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="card-main-info">
                            ${thumbHtml}
                            <div class="card-details">
                                <div class="card-title">${itemTitle.toUpperCase()}</div>
                                <div class="card-desc">${displayDesc}</div>
                            </div>
                        </div>
                        ${actionControls}
                    `;
                    feedContainer.appendChild(card);
                }
            }
        }

        /* Displays the full card inside the Search overlay */
        function showSearchWikiCard(key, item) {
            document.getElementById('search-results-feed').innerHTML = "";
            const view = document.getElementById('wiki-detail-view');
            
            let gridHtml = "";
            if (item.rows && item.rows.length > 0) {
                gridHtml = `<div style="display: grid; grid-template-columns: auto 1fr; gap: 10px 15px; background: #242426; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #2c2c2e;">`;
                item.rows.forEach(r => {
                    gridHtml += `<div style="color: #98989d; font-weight: 600; font-size: 0.9rem; text-transform: capitalize;">${r.key}</div><div style="color: #ffffff; font-weight: 500; font-size: 0.9rem;">${r.val}</div>`;
                });
                gridHtml += `</div>`;
            }

            let headingTitle = key;
            let subTitleText = "";
            let descMainBody = "";

            if (typeof item === 'object') {
                headingTitle = item.title || item.name || key;
                subTitleText = item.shortDesc || '';
                descMainBody = item.about || item.text || '';
            } else {
                descMainBody = item;
            }

            const imgCover = (item && typeof item === 'object' && item.src) ? item.src : '';

            view.innerHTML = `
                <button style="position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; z-index: 10;" onclick="document.getElementById('wiki-detail-view').style.display='none'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
                ${imgCover ? `<img src="${imgCover}" style="width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid #2c2c2e;">` : `<div style="height:20px;"></div>`}
                <div style="padding: 20px 20px 10px 20px;">
                    <h2 style="font-size: 1.75rem; font-weight: 800; color: #fff; margin: 0 0 5px 0;">${headingTitle.toUpperCase()}</h2>
                    ${subTitleText ? `<p style="font-size: 1rem; color: #8e8e93; margin: 0 0 15px 0;">${subTitleText}</p>` : ''}
                    ${gridHtml}
                </div>
                ${descMainBody ? `<div style="font-size: 1rem; line-height: 1.6; color: #d1d1d6; white-space: pre-wrap; padding: 0 20px 20px 20px;">${descMainBody}</div>` : ''}
            `;
            view.style.display = 'flex';
        }

        /* --- ADVANCED EDIT & ADD SYSTEM --- */
        function editCard(key) {
            const item = db[key];
            if (!item) return;

            document.getElementById('wiki-detail-view').style.display = 'none';
            document.getElementById('advanced-form-card').style.display = 'flex';
            
            document.getElementById('form-heading').innerText = "Edit Data Entry";
            document.getElementById('form-edit-id').value = key;
            document.getElementById('form-title').value = item.title || item.name || key;
            document.getElementById('form-short-desc').value = item.shortDesc || '';
            document.getElementById('form-about').value = item.about || item.text || '';
            
            tempFormImageBase64 = item.src || '';
            const previewImg = document.getElementById('form-image-preview');
            if (tempFormImageBase64) {
                previewImg.src = tempFormImageBase64;
                document.getElementById('form-image-preview-container').style.display = 'block';
            } else {
                document.getElementById('form-image-preview-container').style.display = 'none';
            }

            // Restore Questions
            const qContainer = document.getElementById('questions-container');
            qContainer.innerHTML = "";
            if (item.questions && item.questions.length > 0) {
                item.questions.forEach(q => addQuestionBox(q));
            }

            // Restore Rows
            const rowContainer = document.getElementById('rows-container');
            rowContainer.innerHTML = "";
            if (item.rows && item.rows.length > 0) {
                item.rows.forEach(r => addRowBox(r));
            } else {
                addRowBox();
            }
        }

        function deleteCard(key) {
            if (confirm(`🚨 Are you sure you want to delete "${key}" from your database?`)) {
                delete db[key];
                if (dbInstance) {
                    dbInstance.transaction([storeName], "readwrite").objectStore(storeName).delete(key).onsuccess = function() {
                        performPadSearch({ target: document.getElementById('padSearchInput') });
                    };
                }
            }
        }

        function showAdvancedForm() {
            document.getElementById('advanced-form-card').style.display = 'flex';
            document.getElementById('form-heading').innerText = "Add New Data";
            document.getElementById('form-edit-id').value = "";
            document.getElementById('questions-container').innerHTML = "";
            document.getElementById('rows-container').innerHTML = "";
            document.getElementById('form-image-preview-container').style.display = 'none';
            hideAdvancedFormInputs();
            addQuestionBox();
            addRowBox();
        }

        function hideAdvancedFormInputs() {
            tempFormImageBase64 = "";
            document.getElementById('form-title').value = "";
            document.getElementById('form-short-desc').value = "";
            document.getElementById('form-image').value = "";
            document.getElementById('form-about').value = "";
        }

        function hideAdvancedForm() {
            document.getElementById('advanced-form-card').style.display = 'none';
            hideAdvancedFormInputs();
        }

        function addQuestionBox(val = "") {
            const container = document.getElementById('questions-container');
            const div = document.createElement('div');
            div.style.cssText = "display: flex; align-items: center; gap: 10px; margin-bottom: 5px;";
            div.innerHTML = `
                <input type="text" class="q-input" style="flex:1; background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; font-size: 0.95rem; outline: none;" placeholder="e.g. What is Google?" value="${val}">
                <button style="background: #3a1515; color: #ff453a; border: 1px solid #5a2020; width: 40px; height: 40px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        function addRowBox(keyVal = {key: "", val: ""}) {
            const container = document.getElementById('rows-container');
            const div = document.createElement('div');
            div.style.cssText = "display: flex; align-items: center; gap: 10px; margin-bottom: 5px;";
            div.innerHTML = `
                <div style="flex: 1; display: flex; align-items: center; background: #000; border: 1px solid #333; border-radius: 10px; padding: 3px 5px;">
                    <input type="text" class="row-key" style="background: transparent; border: none; color: #fff; padding: 8px; font-size: 0.95rem; outline: none; flex: 1; min-width: 0;" placeholder="Key (e.g. Founder)" value="${keyVal.key}">
                    <div style="width: 1px; height: 20px; background: #444; margin: 0 4px;"></div>
                    <input type="text" class="row-val" style="background: transparent; border: none; color: #fff; padding: 8px; font-size: 0.95rem; outline: none; flex: 1; min-width: 0;" placeholder="Value (e.g. Larry Page)" value="${keyVal.val}">
                </div>
                <button style="background: #3a1515; color: #ff453a; border: 1px solid #5a2020; width: 40px; height: 40px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        function handleFormImage(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                tempFormImageBase64 = event.target.result;
                const previewImg = document.getElementById('form-image-preview');
                previewImg.src = tempFormImageBase64;
                document.getElementById('form-image-preview-container').style.display = 'block';
            };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        }

        function saveAdvancedData() {
            const title = document.getElementById('form-title').value.trim();
            const shortDesc = document.getElementById('form-short-desc').value.trim();
            const about = document.getElementById('form-about').value.trim();
            const editId = document.getElementById('form-edit-id').value;

            if (!title || !about) { alert("Title and About fields are required!"); return; }

            const targetId = editId ? editId : title.toLowerCase();

            // Collect Questions
            const questions = [];
            document.querySelectorAll('.q-input').forEach(input => {
                const val = input.value.trim().toLowerCase();
                if (val) questions.push(val);
            });

            // Collect Rows
            const rows = [];
            document.querySelectorAll('.row-key').forEach((keyInput, index) => {
                const valInput = document.querySelectorAll('.row-val')[index];
                const k = keyInput.value.trim();
                const v = valInput.value.trim();
                if (k && v) rows.push({ key: k, val: v });
            });

            const dataObj = {
                type: 'advanced', id: targetId, title: title, shortDesc: shortDesc,
                src: tempFormImageBase64, questions: questions, rows: rows, about: about, text: about
            };

            db[targetId] = dataObj;
            persistData(targetId, dataObj);
            
            hideAdvancedForm();
            performPadSearch({ target: document.getElementById('padSearchInput') }); 
            alert("✅ Entry safely saved inside DB!");
        }

        /* --- 💬 MAIN CHAT ENGINE --- */
        function handleEnter(e) { if (e.key === 'Enter') handleSendClick(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempImageBase64 = e.target.result;
                lastImageForEdit = tempImageBase64; 
                
                stopAnimation(false);

                const userDiv = document.createElement('div');
                userDiv.className = 'user-msg';
                const userImg = document.createElement('img');
                userImg.src = tempImageBase64;
                userDiv.appendChild(userImg);
                chatContainer.appendChild(userDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                let matchedEntry = null;
                for (let key in db) {
                    if (db[key] && db[key].src === tempImageBase64) {
                        matchedEntry = db[key];
                        break;
                    }
                }

                if (matchedEntry) {
                    setTimeout(() => {
                        const aiDiv = document.createElement('div');
                        aiDiv.className = 'ai-msg';
                        chatContainer.appendChild(aiDiv);
                        
                        const img = document.createElement('img');
                        img.src = matchedEntry.src;
                        img.style.marginBottom = "12px";
                        aiDiv.appendChild(img);
                        
                        const textSpan = document.createElement('span');
                        aiDiv.appendChild(textSpan);
                        animateText(textSpan, matchedEntry.about || matchedEntry.text || "");
                    }, 500);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function setButtonState(animating) {
            isAnimating = animating;
            const sendBtn = document.getElementById('sendBtn');
            if (isAnimating) {
                sendBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><rect x="8" y="8" width="8" height="8" fill="currentColor" rx="1" /></svg>`;
            } else {
                sendBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M8 16l8-8M11 8h5v5"/></svg>`;
            }
        }

        function stopAnimation(manual = false) {
            if (animationTimeout) { clearTimeout(animationTimeout); animationTimeout = null; }
            setButtonState(false);
            isAnimating = false;
            if (manual && currentTypingElement) {
                currentTypingElement.textContent = currentTypingText.substring(0, currentTypingIndex) + ".";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function handleSendClick() { if (isAnimating) { stopAnimation(true); } else { sendMessage(); } }

        function animateText(element, text, speed = 40, startIndex = 0) { 
            if (startIndex === 0) { stopAnimation(false); element.textContent = ""; }
            setButtonState(true);
            isAnimating = true;
            currentTypingText = text; currentTypingElement = element; currentTypingIndex = startIndex;
            
            function type() {
                if (currentTypingIndex < currentTypingText.length) {
                    element.textContent = currentTypingText.substring(0, currentTypingIndex + 1);
                    currentTypingIndex++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    animationTimeout = setTimeout(type, speed);
                } else {
                    setButtonState(false);
                    isAnimating = false;
                }
            }
            type();
        }

        function sendMessage() {
            const query = searchBox.value.trim();
            if (!query) return;

            stopAnimation(false); 
            lastImageForEdit = null; 

            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            userDiv.innerText = query;
            chatContainer.appendChild(userDiv);
            searchBox.value = '';
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

            lastQuery = query.toLowerCase();
            setTimeout(() => { triggerChatResponse(query); }, 400); 
        }

        function triggerChatResponse(rawKey) {
            let queryVal = rawKey.trim().toLowerCase();
            
            let showImage = false;
            let showText = true;
            let showGrid = false;

            // Conditional Word Filtering
            if (queryVal.endsWith(" image")) {
                showImage = true; showText = false; showGrid = false;
                queryVal = queryVal.replace(/ image$/, "").trim();
            } else if (queryVal.endsWith(" all")) {
                showImage = true; showText = true; showGrid = true;
                queryVal = queryVal.replace(/ all$/, "").trim();
            } else if (queryVal.endsWith(" details")) {
                showImage = true; showText = true; showGrid = true;
                queryVal = queryVal.replace(/ details$/, "").trim();
            }

            let matchedData = null;

            // Core Matching Logic
            for (let dbKey in db) {
                const item = db[dbKey];
                const itemTitle = (item.title || item.name || dbKey).toLowerCase();

                if (itemTitle === queryVal || dbKey.toLowerCase() === queryVal || (item.questions && item.questions.includes(queryVal))) {
                    matchedData = item;
                    break;
                }
            }

            // Fallback for Row searches (e.g. "Minecraft Developer" -> "Mojang")
            if (!matchedData) {
                for (let dbKey in db) {
                    const item = db[dbKey];
                    if (queryVal.includes((item.title || dbKey).toLowerCase())) {
                        if (item.rows) {
                            for (let r of item.rows) {
                                if (queryVal.includes(r.key.toLowerCase())) {
                                    matchedData = { type: 'row', text: r.val };
                                    showImage = false; showGrid = false; showText = true;
                                    break;
                                }
                            }
                        }
                    }
                    if (matchedData) break;
                }
            }

            if (!matchedData) return; 

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            chatContainer.appendChild(aiDiv);
            
            // Image Rendering (No Animation)
            if (showImage && matchedData.src) {
                const img = document.createElement('img');
                img.src = matchedData.src;
                aiDiv.appendChild(img);
            }

            // Row Key-Values Rendering
            if (showGrid && matchedData.rows && matchedData.rows.length > 0) {
                const gridDiv = document.createElement('div');
                gridDiv.style.cssText = "display: grid; grid-template-columns: auto 1fr; gap: 8px 15px; background: #1a1a1a; padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; font-size: 0.95rem; width: fit-content;";
                matchedData.rows.forEach(r => {
                    gridDiv.innerHTML += `<div style="color: #98989d; font-weight: 600;">${r.key}</div><div style="color: #fff;">${r.val}</div>`;
                });
                aiDiv.appendChild(gridDiv);
            }

            // Text Typing Animation
            if (showText) {
                let answerText = matchedData.text || matchedData.about || matchedData;
                if (typeof answerText !== 'string') answerText = JSON.stringify(answerText);
                
                const textSpan = document.createElement('span');
                aiDiv.appendChild(textSpan);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                animateText(textSpan, answerText);
            } else {
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
