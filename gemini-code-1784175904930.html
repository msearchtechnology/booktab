<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenCLOCK</title>
    <style>
        /* --- EASY COLOR CONFIGURATION --- */
        :root {
            --logo-circle-bg: #000000;
            --sq-12-oclock: #0000FF;   
            --sq-1-30-oclock: #0000FF; 
            --sq-3-oclock: #0000FF;    
            --sq-4-30-oclock: #0000FF; 
            --sq-6-oclock: #0000FF;    
            --sq-7-30-oclock: #0000FF; 
            --sq-9-oclock: #0000FF;    
            --sq-10-30-oclock: #0000FF; 
        }

        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            overflow: hidden;
        }
        
        /* --- Premium Splash Screen --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .splash-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            transition: gap 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .splash-circle {
            width: 60px;
            height: 60px;
            transform-origin: center;
            animation: spinCircle 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .splash-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        }
        .reveal-active .splash-text {
            opacity: 1;
            max-width: 300px;
            margin-left: 15px;
        }
        
        @keyframes spinCircle {
            0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
            60% { transform: scale(1.1) rotate(240deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 10; }
        .menu-icon, .search-icon { width: 24px; height: 24px; stroke: #fff; cursor: pointer; fill: none; }

        .install-banner {
            display: none; 
            position: fixed;
            top: 15px;
            left: 5%;
            right: 5%;
            background-color: #1e1f22;
            border: 1px solid #3c4043;
            padding: 12px 18px;
            border-radius: 16px;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown {
            from { transform: translateY(-80px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .install-text { font-size: 0.95rem; font-weight: 500; }
        .install-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .install-btn:hover { background-color: #e0e0e0; }

        #chat-container { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            padding-bottom: 120px; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        .user-msg { 
            background-color: #2f3032; 
            color: white; 
            padding: 12px 24px; 
            border-radius: 25px; 
            align-self: flex-end; 
            max-width: 75%;
            word-wrap: break-word;
            font-size: 1.05rem;
            border: 1px solid #444;
        }
        .user-msg img {
            max-width: 180px;
            border-radius: 12px;
            display: block;
        }

        .ai-msg { 
            color: #fff; 
            padding: 5px 10px; 
            align-self: flex-start; 
            max-width: 90%;
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap; 
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }
        .ai-msg img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 16px;
            display: block;
        }

        .input-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px 20px 25px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.95) 25%, #000 100%);
            z-index: 5;
        }
        .input-container { 
            background-color: #000; 
            border-radius: 35px; 
            display: flex; 
            align-items: center; 
            padding: 6px 10px; 
            border: 1.5px solid #fff; 
            max-width: 650px;
            margin: 0 auto;
        }
        input[type="text"] { 
            background: transparent; 
            border: none; 
            color: white; 
            flex-grow: 1; 
            padding: 12px 15px; 
            outline: none; 
            font-size: 1.1rem; 
            min-width: 0; 
        }

        .icon-btn { 
            background: none; 
            border: none; 
            color: #80868b; 
            cursor: pointer; 
            width: 44px;
            height: 44px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%;
            flex-shrink: 0; 
            transition: all 0.2s ease;
        }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        
        #sendBtn { color: #fff; background: rgba(255,255,255,0.1); }
        #sendBtn:hover { background: rgba(255,255,255,0.25); color: #fff; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #202124; padding: 25px; border-radius: 15px; width: 85%; max-width: 400px; border: 1px solid #444; }
        .modal-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #555; color: #fff; box-sizing: border-box; border-radius: 8px; font-size: 1rem; }
        textarea.modal-input { font-family: inherit; resize: none; }

        .preview-container { text-align: center; margin-bottom: 15px; }
        .preview-container img { max-height: 120px; border-radius: 8px; border: 1px solid #555; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content">
            <svg class="splash-circle" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="var(--logo-circle-bg)" />
                <g transform="translate(50,50)">
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-12-oclock)" transform="rotate(0)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-1-30-oclock)" transform="rotate(45)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-3-oclock)" transform="rotate(90)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-4-30-oclock)" transform="rotate(135)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-6-oclock)" transform="rotate(180)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-7-30-oclock)" transform="rotate(225)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-9-oclock)" transform="rotate(270)" rx="1"/>
                    <rect x="-7" y="-38" width="14" height="14" fill="var(--sq-10-30-oclock)" transform="rotate(315)" rx="1"/>
                </g>
            </svg>
            <span class="splash-text">OpenCLOCK</span>
        </div>
    </div>

    <div id="installBanner" class="install-banner">
        <span class="install-text">⚡ Install OpenCLOCK App?</span>
        <button class="install-btn" onclick="triggerPWAInstall()">Install</button>
    </div>

    <header>
        <svg class="menu-icon" onclick="clearAllData()"><path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2"/></svg>
        <h3>OpenCLOCK</h3>
        <svg class="search-icon"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2"/></svg>
    </header>

    <div id="chat-container"></div>

    <div class="input-wrapper">
        <div class="input-container">
            <input type="file" id="imageLoader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            
            <button class="icon-btn" onclick="document.getElementById('imageLoader').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            
            <input type="text" id="searchBox" placeholder="Ask OpenCLOCK" onkeypress="handleEnter(event)" oninput="checkAutoEdit(event)">
            
            <button id="sendBtn" onclick="handleSendClick()" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path d="M8 16l8-8M11 8h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
        </div>
    </div>

    <div id="textModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Text Edit Mode</h3>
            <input type="text" id="editKey" class="modal-input" placeholder="Keyword (e.g., Google)">
            <textarea id="editValue" class="modal-input" rows="4" placeholder="About..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button onclick="closeModal('textModal')" style="flex: 1; background: #444; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;">Cancel</button>
                <button onclick="saveTextData()" style="flex: 1; background: #fff; color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">Save</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; margin-bottom: 10px;">Save Image Info</h3>
            <div class="preview-container">
                <img id="modalImgPreview" src="" alt="Selected Image">
            </div>
            <input type="text" id="imageKey" class="modal-input" placeholder="Image Name (e.g., Apple)">
            <textarea id="imageAbout" class="modal-input" rows="3" placeholder="About this image..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <button onclick="closeModal('imageModal')" style="flex: 1; background: #444; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;">Cancel</button>
                <button onclick="saveImageData()" style="flex: 1; background: #fff; color: #000; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">Save</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const searchBox = document.getElementById('searchBox');
        
        let db = {};
        let tempImageBase64 = ""; 
        let lastImageForEdit = null; 
        let lastQuery = ""; 
        let deferredPrompt = null;

        let animationTimeout = null;
        let isAnimating = false;
        let currentTypingText = "";
        let currentTypingIndex = 0;
        let currentTypingElement = null;
        let currentTypingSpeed = 45;

        /* --- INDEXEDDB SYSTEM --- */
        let dbInstance = null;
        const dbName = "OpenClockDB";
        const storeName = "dataStore";

        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function(e) {
            const activeDB = e.target.result;
            if (!activeDB.objectStoreNames.contains(storeName)) {
                activeDB.createObjectStore(storeName);
            }
        };
        request.onsuccess = function(e) {
            dbInstance = e.target.result;
            loadAllDataFromDB(); 
        };

        function loadAllDataFromDB() {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction([storeName], "readonly");
            const objectStore = transaction.objectStore(storeName);
            const cursorReq = objectStore.openCursor();
            db = {}; 
            cursorReq.onsuccess = function(event) {
                const cursor = event.target.result;
                if (cursor) {
                    db[cursor.key] = cursor.value;
                    cursor.continue();
                }
            };
        }

        function persistData(key, value) {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction([storeName], "readwrite");
            const objectStore = transaction.objectStore(storeName);
            objectStore.put(value, key);
        }

        /* HARD DELETE & WIPE ENGINE (STORAGE RESET) */
        function clearAllData() {
            if (!dbInstance) return;
            if (confirm("🚨 Do you want to delete all saved data and clean your storage completely?")) {
                const transaction = dbInstance.transaction([storeName], "readwrite");
                const objectStore = transaction.objectStore(storeName);
                const clearRequest = objectStore.clear();
                
                clearRequest.onsuccess = function() {
                    db = {};
                    lastImageForEdit = null;
                    tempImageBase64 = "";
                    chatContainer.innerHTML = ""; // Clear active window view 
                    alert("🗑️ All data removed successfully! Storage is empty now.");
                };
            }
        }

        /* --- SPLASH SCREEN --- */
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelector('.splash-content').classList.add('reveal-active');
            }, 1200);
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 600); 
            }, 2800);
        });

        /* --- PWA SYSTEM --- */
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'flex';
        });

        function triggerPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('installBanner').style.display = 'none';
                });
            } else {
                alert("To Install: Tap browser Menu (3 dots) and click 'Install app'!");
                document.getElementById('installBanner').style.display = 'none';
            }
        }

        function checkAutoEdit(e) {
            const val = e.target.value.trim().toLowerCase();
            if (val === 'edit') {
                e.target.value = ''; 
                
                if (lastImageForEdit) {
                    document.getElementById('modalImgPreview').src = lastImageForEdit;
                    document.getElementById('imageKey').value = '';
                    document.getElementById('imageAbout').value = '';
                    document.getElementById('imageModal').style.display = 'flex';
                } else {
                    if (lastQuery) document.getElementById('editKey').value = lastQuery;
                    document.getElementById('textModal').style.display = 'flex';
                }
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') handleSendClick(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                tempImageBase64 = e.target.result;
                lastImageForEdit = tempImageBase64; 
                
                stopAnimation(false);

                const userDiv = document.createElement('div');
                userDiv.className = 'user-msg';
                const userImg = document.createElement('img');
                userImg.src = tempImageBase64;
                userDiv.appendChild(userImg);
                chatContainer.appendChild(userDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                let matchedEntry = null;
                for (let key in db) {
                    if (db[key] && db[key].src === tempImageBase64 && db[key].type === 'image_and_text') {
                        matchedEntry = db[key];
                        break;
                    }
                }

                if (matchedEntry) {
                    setTimeout(() => {
                        const aiDiv = document.createElement('div');
                        aiDiv.className = 'ai-msg';
                        chatContainer.appendChild(aiDiv);
                        
                        const textSpan = document.createElement('span');
                        aiDiv.appendChild(textSpan);
                        animateText(textSpan, matchedEntry.text);
                    }, 500);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = ''; 
        }

        function setButtonState(animating) {
            isAnimating = animating;
            const sendBtn = document.getElementById('sendBtn');
            if (isAnimating) {
                sendBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                        <rect x="8" y="8" width="8" height="8" fill="currentColor" rx="1" />
                    </svg>
                `;
            } else {
                sendBtn.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                        <path d="M8 16l8-8M11 8h5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                `;
            }
        }

        function stopAnimation(manual = false) {
            if (animationTimeout) {
                clearTimeout(animationTimeout);
                animationTimeout = null;
            }
            setButtonState(false);
            isAnimating = false;
            
            if (manual && currentTypingElement) {
                currentTypingElement.textContent = currentTypingText.substring(0, currentTypingIndex) + ".";
                
                const controlDiv = document.createElement('div');
                controlDiv.className = 'resume-control';
                controlDiv.style.cssText = "display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; color: #80868b; font-size: 0.85rem; padding: 2px 4px; font-weight: 500; user-select: none;";
                controlDiv.innerHTML = `
                    <span>AI response stop</span>
                    <button onclick="resumeAnimation(this)" style="background: none; border: none; color: #80868b; cursor: pointer; padding: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; border-radius: 4px;" onmouseover="this.style.color='#fff'; this.style.transform='rotate(30deg)';" onmouseout="this.style.color='#80868b'; this.style.transform='rotate(0deg)';">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M16 3h5v5"/></svg>
                    </button>
                `;
                currentTypingElement.parentNode.appendChild(controlDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function resumeAnimation(btn) {
            const parentPanel = btn.parentElement;
            parentPanel.remove();
            
            if (currentTypingElement) {
                currentTypingElement.textContent = currentTypingText.substring(0, currentTypingIndex);
                animateText(currentTypingElement, currentTypingText, currentTypingSpeed, currentTypingIndex);
            }
        }

        function handleSendClick() {
            if (isAnimating) {
                stopAnimation(true);
            } else {
                sendMessage();
            }
        }

        function animateText(element, text, speed = 45, startIndex = 0) { 
            if (startIndex === 0) {
                stopAnimation(false);
                element.textContent = ""; 
            }
            
            setButtonState(true);
            isAnimating = true;
            
            currentTypingText = text;
            currentTypingElement = element;
            currentTypingSpeed = speed;
            currentTypingIndex = startIndex;
            
            function type() {
                if (currentTypingIndex < currentTypingText.length) {
                    const isUserAtBottom = (chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight) < 100;
                    
                    element.textContent = currentTypingText.substring(0, currentTypingIndex + 1);
                    currentTypingIndex++;
                    
                    if (isUserAtBottom) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                    
                    animationTimeout = setTimeout(type, currentTypingSpeed);
                } else {
                    setButtonState(false);
                    isAnimating = false;
                }
            }
            type();
        }

        function sendMessage() {
            const query = searchBox.value.trim();
            if (!query) return;

            stopAnimation(false); 
            lastImageForEdit = null; 

            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            userDiv.innerText = query;
            chatContainer.appendChild(userDiv);
            searchBox.value = '';
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

            lastQuery = query.toLowerCase();
            setTimeout(() => { triggerResponse(lastQuery); }, 400); 
        }

        function triggerResponse(key) {
            const data = db[key];
            if (!data) return; 

            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            chatContainer.appendChild(aiDiv);
            
            if (typeof data === 'object') {
                if (data.type === 'text') {
                    const textSpan = document.createElement('span');
                    aiDiv.appendChild(textSpan);
                    animateText(textSpan, data.text);
                } else if (data.type === 'image_only') {
                    const img = document.createElement('img');
                    img.src = data.src;
                    aiDiv.appendChild(img);
                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                } else if (data.type === 'image_and_text') {
                    const img = document.createElement('img');
                    img.src = data.src;
                    img.style.marginBottom = "10px";
                    aiDiv.appendChild(img);
                    
                    const textSpan = document.createElement('span');
                    aiDiv.appendChild(textSpan);
                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                    
                    animateText(textSpan, data.text);
                }
            } else {
                const textSpan = document.createElement('span');
                aiDiv.appendChild(textSpan);
                animateText(textSpan, data); 
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
            if (modalId === 'textModal') {
                document.getElementById('editKey').value = '';
                document.getElementById('editValue').value = '';
            } else {
                document.getElementById('imageKey').value = '';
                document.getElementById('imageAbout').value = '';
            }
        }

        function saveTextData() {
            const key = document.getElementById('editKey').value.trim().toLowerCase();
            const value = document.getElementById('editValue').value.trim();
            if (!key || !value) { alert("Please fill both boxes!"); return; }

            const entry = { type: 'text', text: value };
            db[key] = entry;
            persistData(key, entry); 
            closeModal('textModal');
            setTimeout(() => { triggerResponse(key); }, 300);
        }

        function saveImageData() {
            const titleInput = document.getElementById('imageKey').value.trim();
            const titleKey = titleInput.toLowerCase();
            const aboutInput = document.getElementById('imageAbout').value.trim();
            if (!titleInput || !aboutInput || !lastImageForEdit) { alert("Please complete details!"); return; }

            const dataAll = { 
                type: 'image_and_text', 
                src: lastImageForEdit, 
                text: aboutInput,
                name: titleInput
            };

            db[titleKey] = dataAll;
            db[titleKey + " all"] = dataAll;
            db[titleKey + " image"] = { type: 'image_only', src: lastImageForEdit };

            persistData(titleKey, dataAll);
            persistData(titleKey + " all", dataAll);
            persistData(titleKey + " image", { type: 'image_only', src: lastImageForEdit });

            closeModal('imageModal');
        }
    </script>
</body>
</html>
